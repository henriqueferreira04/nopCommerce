services:
    nopcommerce_web:
        build: .
        container_name: nopcommerce
        ports:
            - "80:80"
        depends_on:
            - nopcommerce_database
            - otel-collector
        volumes:
            - nopcommerce_appdata:/app/App_Data
        environment:
            - Otlp__Endpoint=http://otel-collector:4317
    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        volumes:
            - nopcommerce_data:/var/opt/mssql
        ports:
            - "1433:1433"
        environment:
            SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"

    jaeger:
        image: jaegertracing/all-in-one:latest
        container_name: jaeger
        ports:
            - "16686:16686" # Jaeger UI

    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        container_name: otel-collector
        volumes:
            - ./otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
        ports:
            - "4317:4317"   # OTLP gRPC
            - "4318:4318"   # OTLP HTTP
            - "8889:8889"   # Prometheus metrics
        depends_on:
            - jaeger

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3000:3000"
        depends_on:
            - prometheus
            - jaeger
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_INSTALL_PLUGINS=jaeger
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning
            - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  nopcommerce_data:
  nopcommerce_appdata:            